<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17202a">
    <title>Staff Dashboard | BiteRush</title>
    <link rel="stylesheet" href="Staff.css">
    <link rel="stylesheet" href="../BackButtons.css">
</head>
<body class="dashboard-page">
    <header class="staff-header">
        <a class="staff-brand" href="../BiteRushHomePage/index.html" aria-label="BiteRush home">
            <img src="../BiteRushHomePage/HomePagePics/burger.png" alt="">
            <span>BiteRush</span>
        </a>
        <div class="staff-header-actions">
            <span class="staff-label">STAFF PORTAL</span>
            <button class="sign-out-button" id="signOutButton" type="button">Sign out</button>
        </div>
    </header>

    <main class="dashboard-main">
        <section class="dashboard-welcome">
            <div>
                <p class="eyebrow">STAFF DASHBOARD</p>
                <h1>Welcome, <span id="staffName">Staff</span></h1>
                <p>Search, assign, update, and fulfill customer orders.</p>
            </div>
        </section>
        <section class="order-card fulfillment-card" aria-labelledby="ordersHeading">
            <div class="order-card-header fulfillment-heading">
                <div>
                    <p class="eyebrow">FULFILLMENT</p>
                    <h2 id="ordersHeading">Orders</h2>
                </div>
                <span class="order-status" id="orderCount">0 orders</span>
            </div>
            <div class="fulfillment-layout">
                <div class="orders-list-column">
                    <div class="orders-toolbar">
                        <input id="orderSearch" type="search" placeholder="Search order or address" aria-label="Search orders">
                        <select id="orderFilter" aria-label="Filter orders by status">
                            <option value="all">All statuses</option>
                            <option value="received">Order received</option>
                            <option value="preparing">Preparing</option>
                            <option value="on_the_way">On the way</option>
                            <option value="delivered">Delivered</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                        <button class="secondary-button" id="selectPageButton" type="button">Select page</button>
                    </div>
                    <div class="bulk-order-actions" id="bulkActions" hidden>
                        <strong><span id="selectedCount">0</span> selected</strong>
                        <select id="bulkStatus" aria-label="Bulk order status">
                            <option value="preparing">Preparing</option>
                            <option value="on_the_way">On the way</option>
                            <option value="delivered">Delivered</option>
                        </select>
                        <button class="save-status-button" id="applyBulkButton" type="button">Apply status</button>
                        <button class="secondary-button" id="clearSelectedButton" type="button">Clear</button>
                    </div>
                    <div id="ordersList" class="staff-orders-list" aria-live="polite"></div>
                    <div class="pagination" id="ordersPagination"></div>
                </div>
                <section class="order-detail-panel" id="orderDetail" aria-label="Selected order details">
                    <p class="empty-order">Select an order to view its details.</p>
                </section>
            </div>
            <p class="order-message" id="orderMessage" role="status" aria-live="polite" hidden></p>
        </section>
    </main>

    <script src="../api.js?v=12"></script>
    <script src="dashboard.js?v=2"></script>
</body>
</html>
